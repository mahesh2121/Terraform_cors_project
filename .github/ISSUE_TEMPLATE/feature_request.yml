name: Feature request
description: Suggest a new module, feature, or CI/CD improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Check the module standards in
        [AGENTS.md](https://github.com/mahesh2121/Terraform_cors_project/blob/master/AGENTS.md)
        before submitting.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New Terraform module
        - Existing module enhancement
        - Example
        - CI/CD pipeline
        - Repository standards / docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should the module/workflow do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways to solve the problem.
  - type: textarea
    id: config
    attributes:
      label: Example configuration
      description: If applicable, sketch the Terraform API you would expect.
      render: hcl
